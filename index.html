<body>
<main class="final-shell"><section class="phone" aria-label="Photo Pick 최종 프로토타입"><header class="header" id="screen-header"></header><div id="app"></div><div id="layer"></div><input id="directory-input" type="file" webkitdirectory multiple accept=".jpg,.jpeg,image/jpeg" hidden><input id="files-input" type="file" multiple accept=".jpg,.jpeg,image/jpeg" hidden></section></main>
<script src="assets/asset-manifest.js"></script>
<script>
const demoPhotos = [
 ['photo-1519608487953-e999c86e7455','도시의 저녁'],['photo-1519501025264-65ba15a82390','맨해튼의 빛'],['photo-1477959858617-67f85cf4f1df','골목의 오후'],['photo-1514565131-fce0801e5785','도시 산책'],['photo-1449824913935-59a10b8d2000','거리의 순간'],['photo-1480714378408-67cf0d13bc1b','늦은 오후'],['photo-1519608487953-e999c86e7455','늦은 밤 산책'],['photo-1514924013411-cbf25faa35bb','여행의 기록'],['photo-1511818966892-d7d671e672a2','도시의 선']
].map(([id,label],i)=>({id:i,label,url:window.PHOTO_PICK_ASSETS?.photos?.[i] || `https://images.unsplash.com/${id}?auto=format&fit=crop&w=900&q=85`}));
let sourcePhotos=demoPhotos;
const KEY='photopick.prototype.final.v1',SESSION='demo-city-v1';
const labels={skip:'별로',keep:'좋음',best:'아주 좋음'},symbols={skip:'×',keep:'✓',best:'★'};
const icons={skip:'<path d="m7 7 10 10M17 7 7 17"/>',keep:'<path d="M7 10v10H3V10zm0 0 5-7c2 0 2 2 1 5h5c2 0 2 2 1 4l-2 8H7"/>',best:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>'};
const fresh=()=>({version:2,session:SESSION,dataset:'demo',descriptors:demoPhotos.map(p=>({path:p.label,name:p.label,size:0,mtime:0})),folderName:'서울, 주말 산책',screen:'home',mode:'card',index:0,ratings:{},history:[],scope:'best',albumFilter:'all',hintSeen:false,imported:[],progress:0});
let state=fresh(),saved=null,storageOK=true,modalId=null,transferTimer=null,scanTimer=null,homeMessage='';
const app=document.querySelector('#app'),layer=document.querySelector('#layer');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function total(){return state.descriptors.length;}
function validRatings(r,n){return r&&typeof r==='object'&&!Array.isArray(r)&&Object.entries(r).every(([id,v])=>/^(0|[1-9]\d*)$/.test(id)&&Number(id)<n&&['skip','keep','best'].includes(v));}
function validSnapshot(s,n){return s&&Number.isInteger(s.index)&&s.index>=0&&s.index<=n&&validRatings(s.ratings,n);}
function validDescriptors(d){return Array.isArray(d)&&d.length>0&&d.every(x=>x&&typeof x.path==='string'&&typeof x.name==='string'&&Number.isSafeInteger(x.size)&&x.size>=0&&Number.isFinite(x.mtime));}
try{const raw=localStorage.getItem(KEY);if(raw){let data;try{data=JSON.parse(raw);}catch(e){data=null;}if(data&&data.version===1&&data.session===SESSION)data={...fresh(),...data,version:2};if(data&&data.version===2&&['demo','real'].includes(data.dataset)&&(data.dataset==='demo'?data.session===SESSION:data.session==='sd-jpeg-v1')&&validDescriptors(data.descriptors)&&typeof data.folderName==='string'&&(data.dataset!=='demo'||JSON.stringify(data.descriptors)===JSON.stringify(fresh().descriptors))&&validSnapshot(data,data.descriptors.length)&&['card','grid'].includes(data.mode)&&['best','combined'].includes(data.scope)&&['all','unrated','skip','keep','best'].includes(data.albumFilter)&&Array.isArray(data.history)&&data.history.every(x=>validSnapshot(x,data.descriptors.length))){saved={...fresh(),...data,screen:'home',imported:[],progress:0};state={...saved};if(state.dataset==='real')sourcePhotos=[];}}}catch(e){storageOK=false;}
function persist(){const data={version:2,session:state.session,dataset:state.dataset,descriptors:state.descriptors,folderName:state.folderName,index:state.index,ratings:{...state.ratings},history:state.history.slice(-40),mode:state.mode,scope:state.scope,albumFilter:state.albumFilter,hintSeen:state.hintSeen};saved={...fresh(),...data};try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;}catch(e){storageOK=false;}}
function revokePhotos(){sourcePhotos.forEach(p=>{if(p.url.startsWith('blob:'))URL.revokeObjectURL(p.url);});}
function photoError(img){img.style.opacity='0';const box=img.parentElement;box.style.background='#d8e5f1';if(!box.querySelector('.image-error')){const note=document.createElement('span');note.className='image-error';note.textContent='이미지를 표시할 수 없어요';box.appendChild(note);}}
function icon(v){return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[v]}</svg>`;}
function img(p,extra=''){return `<img src="${p.url}" alt="${esc(p.label)}" ${extra} onerror="photoError(this)">`;}
function counts(){const c={skip:0,keep:0,best:0,unrated:0};state.descriptors.forEach((p,id)=>c[state.ratings[id]||'unrated']++);return c;}
function selected(){return sourcePhotos.filter(p=>state.ratings[p.id]==='best'||(state.scope==='combined'&&state.ratings[p.id]==='keep'));}
function firstUnrated(){const id=state.descriptors.findIndex((p,id)=>!state.ratings[id]);return id<0?total():id;}
function badge(p){const grade=state.ratings[p.id];return `<span class="grade-badge ${grade||'unrated'}">${grade?icon(grade):'미평가'}</span>`;}
function tile(p){return `<button class="tile" data-photo="${p.id}" aria-label="${esc(p.label)} · ${labels[state.ratings[p.id]]||'미평가'} · 평가하기">${img(p)}${badge(p)}</button>`;}
function actions(p){return `<div class="overlay">${['skip','keep','best'].map(v=>`<div class="action-item"><button class="action ${v==='keep'?'good':v==='best'?'best':''} ${state.ratings[p.id]===v?'active':''}" data-rate="${v}" aria-label="${labels[v]}" aria-pressed="${state.ratings[p.id]===v}">${icon(v)}</button><span>${labels[v]}</span></div>`).join('')}</div>`;}
function uiIcon(name){const paths={back:'<path d="m9 4-6 6 6 6M3 10h11a7 7 0 0 1 0 14"/>',menu:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',folder:'<path d="M3 7V4h7l3 3h8v14H3z"/>',file:'<path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/>',stats:'<path d="M5 13v8M12 5v16M19 9v12"/>',download:'<path d="M12 3v13m-6-6 6 6 6-6M3 16v5h18v-5"/>',play:'<path d="m8 4 13 8-13 8z"/>',right:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 5 5 9-10"/>'};return `<svg viewBox="0 0 26 26" aria-hidden="true">${paths[name]||''}</svg>`;}
function card(p){return `<div class="card ${state.dataset==='demo'?'demo-card':'real-card'}" id="photo-card">${img(p)}${state.dataset==='real'?`<div class="photo-meta"><span class="filename">${esc(p.label)}</span></div>`:''}${actions(p)}</div>`;}
function header(){const c=counts(),titles={home:'SD카드 연결',scan:'사진 읽기',pick:'사진 평가',summary:'평가 결과',transfer:'사진 저장',ready:'저장 체험 완료'};document.querySelector('#screen-header').dataset.screen=state.screen;document.querySelector('#screen-header').innerHTML=`<button class="icon-button" id="screen-back" aria-label="${state.screen==='pick'?'이전 평가 되돌리기':'이전 화면'}">${uiIcon('back')}${state.screen==='pick'?'<span>되돌리기</span>':''}</button><div><h1>${titles[state.screen]}</h1>${state.screen==='pick'?`<p>${Math.min(state.index+1,total())} / ${total()}</p>`:state.screen==='summary'?`<p>${total()-c.unrated} / ${total()}장 평가 완료</p>`:''}</div><button class="icon-button" id="screen-menu" aria-label="메뉴">${uiIcon('menu')}</button>`;}
function render(){layer.innerHTML='';modalId=null;document.querySelector('.phone').dataset.screen=state.screen;header();const screens={home:home,scan:scan,pick:pick,summary:summary,transfer:transfer,ready:ready};screens[state.screen]();bind();}
function home(){const c=counts(),hasSession=!!saved,needsFiles=hasSession&&state.dataset==='real'&&!sourcePhotos.length;app.innerHTML=`<div class="connection-art"><img src="${window.PHOTO_PICK_ASSETS?.connection||'assets/connection-guide.png'}" alt="SD카드를 USB-C 카드 리더기에 넣고 휴대폰에 연결하는 순서"></div><ol class="connection-steps"><li><span>1</span><div><b>리더기에 SD카드를 넣으세요</b><p>SD카드를 카드 리더기에 넣어주세요.</p></div></li><li><span>2</span><div><b>기기에 리더기를 연결하세요</b><p>리더기의 USB-C를 기기에 연결하세요.</p></div></li><li><span>3</span><div><b>사진 폴더를 선택하세요</b><p>열고 싶은 SD카드의 사진 폴더를 선택하세요.</p></div></li></ol>${hasSession?`<div class="resume-panel"><span>${esc(state.folderName)} · ${total()-c.unrated} / ${total()}장 평가</span>${needsFiles?'<small>같은 폴더를 다시 선택하면 이어서 평가해요.</small>':`<button class="subtle blue" id="resume">이어서 평가 ${uiIcon('right')}</button>`}</div>`:''}<button class="cta" id="folder">${uiIcon('folder')}${needsFiles?'SD카드 폴더 다시 선택':'SD카드 폴더 선택'}</button><button class="cta secondary file-cta" id="files">${uiIcon('file')}사진 파일 선택</button><button class="demo-link" id="demo">예시 사진으로 체험 ${uiIcon('right')}</button>${homeMessage?`<p class="input-message" role="status">${esc(homeMessage)}</p>`:''}${storageOK?'':'<p class="small-note">이 브라우저에서는 이어하기 저장을 사용할 수 없어요.</p>'}`;}
function scan(){app.innerHTML=`<div class="folder-panel">${uiIcon('folder')}<div><b>${state.dataset==='demo'?'DCIM / 100_FUJI':esc(state.folderName)}</b><p>${state.dataset==='demo'?'SD카드 > DCIM > 100_FUJI':'SD카드 > '+esc(state.folderName)}</p></div></div><div class="grid scan-grid">${sourcePhotos.slice(0,4).map(p=>`<div class="tile">${img(p)}<span class="scan-check">${uiIcon('check')}</span></div>`).join('')}</div><div class="scan-progress"><div class="progress"><i style="width:${state.progress}%"></i></div><span>${state.progress===100?total():Math.floor(total()*state.progress/100)} / ${total()}</span></div><div class="scan-caption"><h2>JPEG <strong>${total()}장</strong>을 찾았어요</h2><p>사진은 아직 휴대폰에 저장되지 않았어요.</p></div><button class="cta" id="begin" ${state.progress<100?'disabled':''}>${uiIcon('stats')}평가 시작</button>`;}
function albumPhotos(){return sourcePhotos.filter(p=>state.albumFilter==='all'||(state.albumFilter==='unrated'?!state.ratings[p.id]:state.ratings[p.id]===state.albumFilter));}
function pick(){const c=counts(),shown=albumPhotos();app.innerHTML=`<nav class="mode-switch" aria-label="사진 보기"><button data-mode="card" class="${state.mode==='card'?'active':''}" aria-pressed="${state.mode==='card'}">한 장씩</button><button data-mode="grid" class="${state.mode==='grid'?'active':''}" aria-pressed="${state.mode==='grid'}">앨범</button></nav>${state.mode==='card'?(state.index<total()?card(sourcePhotos[state.index]):'<div class="done-card"><div><h3>모든 사진을 평가했어요</h3><button class="subtle" id="review">처음부터 다시 보기</button></div></div>'):`<div class="album-filters" aria-label="평가 필터">${[['all','전체',total()],['unrated','미평가',c.unrated],['best','아주 좋음',c.best],['keep','좋음',c.keep],['skip','별로',c.skip]].map(([v,label,n])=>`<button data-albumfilter="${v}" class="${state.albumFilter===v?'active':''}" aria-pressed="${state.albumFilter===v}">${label} ${n}</button>`).join('')}</div>${shown.length?`<div class="grid album-grid">${shown.map(tile).join('')}</div>`:'<div class="empty">이 등급의 사진이 없어요.</div>'}`}<button class="cta secondary results-cta" id="summary">${uiIcon('stats')}평가 결과 확인</button><p class="gesture-hint">${state.mode==='grid'?'사진을 눌러 평가 수정':'← 별로　·　→ 좋음　·　↑ 아주 좋음'}</p><p class="original-note">평가해도 원본 사진은 그대로예요.</p>`;}
function summary(){const c=counts(),photos=selected();app.innerHTML=`<div class="summary-counts">${[['best','아주 좋음'],['keep','좋음'],['skip','별로'],['unrated','미평가']].map(([v,label])=>`<div class="rating-row"><span class="rating-symbol ${v}">${v==='unrated'?'<i></i>':icon(v)}</span><b>${label}</b><strong>${c[v]}장</strong></div>`).join('')}</div>${c.unrated?`<button class="cta secondary continue-cta" id="unrated">${uiIcon('play')}미평가 ${c.unrated}장 이어서 평가 ${uiIcon('right')}</button>`:''}<div class="filters" aria-label="저장할 등급"><button data-scope="best" class="${state.scope==='best'?'active':''}" aria-pressed="${state.scope==='best'}">아주 좋음만 ${c.best}장</button><button data-scope="combined" class="${state.scope==='combined'?'active':''}" aria-pressed="${state.scope==='combined'}">좋음까지 포함 ${c.keep+c.best}장</button></div>${photos.length?`<div class="summary-grid">${photos.map(tile).join('')}</div>`:'<div class="empty summary-empty">아직 고른 사진이 없어요.<br>사진을 평가하거나 저장할 등급을 바꿔주세요.</div>'}<button class="cta" id="import" ${photos.length?'':'disabled'}>${uiIcon('download')}${photos.length}장 저장 진행 체험</button><p class="hint">사진 저장은 아직 체험 기능입니다.</p><button class="demo-link" id="all">전체 평가 보기 ${uiIcon('right')}</button>`;}
function transfer(){const total=state.imported.length,completed=Math.floor(state.progress/100*total);app.innerHTML=`<div class="transfer"><div class="ring" id="percent">${state.progress}%</div><h3>저장 체험 진행 중</h3><p id="transfer-count">${completed} / ${total}장</p><p>실제 파일 복사는 실행되지 않아요.</p></div><div class="progress"><i id="transfer-bar" style="width:${state.progress}%"></i></div><button class="cta secondary" id="cancel">취소하고 결과로 돌아가기</button>`;}
function ready(){app.innerHTML=`<h2 class="screen-title">저장 체험 완료</h2><p class="screen-copy">${state.imported.length}장을 가져오는 과정을 체험했어요.</p><div class="share-preview">${img(state.imported[0]||sourcePhotos[0])}<span>${state.imported.length}장</span></div><button class="cta" id="share">인스타 공유 체험</button><button class="cta secondary" id="saved-photos">사진 보기</button><button class="subtle" id="back">다시 평가</button>`;}
function startFolder(){confirmCandidate({dataset:'demo',photos:demoPhotos,descriptors:fresh().descriptors,folderName:'서울, 주말 산책'});}
function confirmFolder(){document.querySelector('#directory-input').value='';document.querySelector('#directory-input').click();}
async function readSelection(files){if(!files.length)return;const originalScreen=state.screen;layer.innerHTML='<div class="reading-layer" role="status"><div class="ring" id="read-progress">0%</div><p>선택한 파일을 확인하는 중</p></div>';const jpeg=[];for(let i=0;i<files.length;i++){const f=files[i];if(/\.jpe?g$/i.test(f.name))jpeg.push(f);if(i%100===0||i===files.length-1){document.querySelector('#read-progress').textContent=Math.round((i+1)/files.length*100)+'%';await new Promise(resolve=>setTimeout(resolve,0));}}layer.innerHTML='';if(!jpeg.length){homeMessage='JPEG 사진이 없어요. JPG 또는 JPEG가 있는 폴더를 선택해 주세요.';if(originalScreen==='home')render();return;}jpeg.sort((a,b)=>a.lastModified-b.lastModified||(a.webkitRelativePath||a.name).localeCompare(b.webkitRelativePath||b.name));const descriptors=jpeg.map(f=>({path:f.webkitRelativePath||f.name,name:f.name,size:f.size,mtime:f.lastModified}));const relative=jpeg[0].webkitRelativePath;const folderName=relative?relative.split('/')[0]:'선택한 사진';confirmCandidate({dataset:'real',files:jpeg,descriptors,folderName});}
function confirmCandidate(candidate){const same=saved&&saved.dataset===candidate.dataset&&JSON.stringify(saved.descriptors)===JSON.stringify(candidate.descriptors);if(!saved||same){activateCandidate(candidate,same);return;}layer.innerHTML=`<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="restart-title"><h3 id="restart-title">다른 사진으로 시작할까요?</h3><p>기존 평가를 지우고<br>${esc(candidate.folderName)}의 사진 ${candidate.descriptors.length}장을 불러와요.</p><p>원본 사진은 변경하지 않아요.</p><button class="cta" id="confirm-new">새로 시작</button><button class="cta secondary" id="close-sheet">취소</button></section></div>`;layer.querySelector('#confirm-new').onclick=()=>activateCandidate(candidate,false);layer.querySelector('#close-sheet').onclick=()=>layer.innerHTML='';}
function activateCandidate(candidate,same){clearInterval(scanTimer);clearInterval(transferTimer);revokePhotos();sourcePhotos=candidate.dataset==='real'?candidate.files.map((f,id)=>({id,label:f.name,mtime:f.lastModified,url:URL.createObjectURL(f)})):demoPhotos;state=same?{...fresh(),...saved,screen:'scan',imported:[],progress:100}:{...fresh(),dataset:candidate.dataset,descriptors:candidate.descriptors,folderName:candidate.folderName,session:candidate.dataset==='real'?'sd-jpeg-v1':SESSION,screen:'scan',progress:100};homeMessage='';persist();render();}
function resume(){if(state.dataset==='real'&&!sourcePhotos.length){confirmFolder();return;}state={...fresh(),...saved,screen:'pick',imported:[],progress:0};state.index=firstUnrated();if(state.index===total())state.screen='summary';render();}
function update(id,value,advance=false){state.history.push({index:state.index,ratings:{...state.ratings}});if(value)state.ratings[id]=value;else delete state.ratings[id];state.hintSeen=true;if(advance){const next=sourcePhotos.find(p=>p.id>id&&!state.ratings[p.id]);state.index=next?next.id:firstUnrated();if(state.index===total())state.screen='summary';}persist();render();}
function rate(value){if(modalId!==null){update(modalId,value);return;}if(state.screen==='pick'&&state.mode==='card'&&state.index<total())update(state.index,value,true);}
function undo(){const previous=state.history.pop();if(!previous)return;state.index=previous.index;state.ratings=previous.ratings;persist();render();}
function openPhoto(id){modalId=id;layer.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="사진 평가"><div class="detail-top"><button id="previous" ${id===0?'disabled':''} aria-label="이전 사진">←</button><span>${id+1} / ${total()}</span><button id="next" ${id===total()-1?'disabled':''} aria-label="다음 사진">→</button><button id="close-detail" aria-label="닫기">×</button></div>${card(sourcePhotos[id])}<button class="clear-rating" id="clear-rating" ${state.ratings[id]?'':'disabled'}>평가 취소</button></div>`;layer.querySelector('#close-detail').onclick=()=>{layer.innerHTML='';modalId=null;};layer.querySelector('#previous').onclick=()=>openPhoto(id-1);layer.querySelector('#next').onclick=()=>openPhoto(id+1);layer.querySelector('#clear-rating').onclick=()=>update(id,null);layer.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));bindSwipe(layer.querySelector('.card'));}
function bindSwipe(el){if(!el)return;let start=null;el.onpointerdown=e=>{if(e.target.closest('button'))return;start={x:e.clientX,y:e.clientY};el.setPointerCapture?.(e.pointerId);};el.onpointercancel=()=>start=null;el.onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>55)rate(dx>0?'keep':'skip');else if(dy < -55&&Math.abs(dy)>Math.abs(dx))rate('best');};}
function startImport(){state.imported=selected().map(p=>({...p}));if(!state.imported.length)return;state.progress=0;state.screen='transfer';render();clearInterval(transferTimer);transferTimer=setInterval(()=>{state.progress=Math.min(100,state.progress+10);if(state.progress===100){clearInterval(transferTimer);state.screen='ready';render();}else{document.querySelector('#percent').textContent=state.progress+'%';document.querySelector('#transfer-bar').style.width=state.progress+'%';document.querySelector('#transfer-count').textContent=`${Math.floor(state.progress/100*state.imported.length)} / ${state.imported.length}장`;}},180);}
function shareSheet(){layer.innerHTML=`<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="공유 준비"><h3>공유할 앱</h3><p>${state.imported.length}장 · 공유 준비 체험</p><button class="cta" id="instagram">Instagram</button><button class="cta secondary" id="close-sheet">취소</button></section></div>`;layer.querySelector('#close-sheet').onclick=()=>layer.innerHTML='';layer.querySelector('#instagram').onclick=()=>{layer.querySelector('.sheet').innerHTML=`<h3>Instagram 공유 준비</h3><p>실제 앱에서는 선택한 사진과 함께<br>게시물 작성 화면을 열어요.</p><p>이 체험에서는 앱 연결과 업로드를 실행하지 않아요.</p><button class="cta" id="close-sheet">확인</button>`;layer.querySelector('#close-sheet').onclick=()=>layer.innerHTML='';};}
function savedAlbum(){layer.innerHTML=`<div class="sheet-backdrop"><section class="sheet saved-sheet" role="dialog" aria-modal="true" aria-label="저장 사진 체험"><h3>가져온 사진 ${state.imported.length}장</h3><p>저장 결과를 보여주는 예시예요.<br>실제 휴대폰 앨범에는 저장되지 않았어요.</p><div class="grid">${state.imported.map(p=>`<div class="tile">${img(p)}</div>`).join('')}</div><button class="cta secondary" id="close-sheet">닫기</button></section></div>`;layer.querySelector('#close-sheet').onclick=()=>layer.innerHTML='';}
function menuSheet(){layer.innerHTML=`<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="메뉴"><h3>Photo Pick</h3><p>평가는 자동으로 저장돼요.<br>별로로 평가해도 원본은 삭제되지 않아요.</p>${['pick','summary'].includes(state.screen)?`<button class="cta secondary" id="menu-undo" ${state.history.length?'':'disabled'}>마지막 평가 되돌리기</button><button class="cta secondary" id="menu-all">전체 평가 보기</button>`:''}<button class="cta secondary" id="menu-home">연결 화면으로</button><button class="cta secondary" id="close-sheet">닫기</button></section></div>`;layer.querySelector('#close-sheet').onclick=()=>layer.innerHTML='';layer.querySelector('#menu-home').onclick=()=>{clearInterval(transferTimer);state.screen='home';render();};const u=layer.querySelector('#menu-undo');if(u)u.onclick=undo;const a=layer.querySelector('#menu-all');if(a)a.onclick=()=>{state.screen='pick';state.mode='grid';state.albumFilter='all';persist();render();};}
function goBack(){if(state.screen==='pick'){if(state.history.length)undo();else{state.screen='scan';state.progress=100;render();}}else if(['summary','ready'].includes(state.screen)){state.screen='pick';render();}else if(state.screen==='transfer'){clearInterval(transferTimer);state.screen='summary';render();}else if(state.screen==='scan'){state.screen='home';render();}else if(saved&&sourcePhotos.length){resume();}else{homeMessage='리더기를 연결한 후 사진 폴더를 선택해 주세요.';render();}}
function bind(){const on=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=fn;};on('screen-back',goBack);on('screen-menu',menuSheet);on('folder',confirmFolder);on('files',()=>{document.querySelector('#files-input').value='';document.querySelector('#files-input').click();});on('demo',startFolder);on('resume',resume);on('begin',()=>{state.screen='pick';state.index=firstUnrated();persist();render();});on('undo',undo);on('pause',()=>{persist();state.screen='home';render();});on('summary',()=>{state.screen='summary';render();});on('back',()=>{state.screen='pick';render();});on('unrated',()=>{state.mode='card';state.index=firstUnrated();state.screen='pick';persist();render();});on('review',()=>{state.index=0;render();});on('all',()=>{state.screen='pick';state.mode='grid';state.albumFilter='all';persist();render();});on('import',startImport);on('cancel',()=>{clearInterval(transferTimer);state.screen='summary';state.imported=[];render();});on('share',shareSheet);on('saved-photos',savedAlbum);document.querySelectorAll('#app [data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));document.querySelectorAll('#app [data-photo]').forEach(b=>b.onclick=()=>openPhoto(Number(b.dataset.photo)));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;persist();render();});document.querySelectorAll('[data-albumfilter]').forEach(b=>b.onclick=()=>{state.albumFilter=b.dataset.albumfilter;persist();render();});document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{state.scope=b.dataset.scope;persist();render();});bindSwipe(document.querySelector('#app .card'));}
document.querySelectorAll('input[type=file]').forEach(input=>input.addEventListener('change',()=>readSelection(Array.from(input.files))));
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='Escape'&&layer.innerHTML){modalId=null;layer.innerHTML='';return;}if(e.key.toLowerCase()==='z'&&['pick','summary'].includes(state.screen)){e.preventDefault();undo();return;}if(modalId===null&&(state.screen!=='pick'||state.mode!=='card'))return;const value={ArrowLeft:'skip',ArrowRight:'keep',ArrowUp:'best'}[e.key];if(value){e.preventDefault();rate(value);}});render();
</script>
</body>
</html>
